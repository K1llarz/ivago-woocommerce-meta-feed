
name: WooCommerce Meta Catalog Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
      timezone: "Asia/Tbilisi"

permissions:
  contents: write

concurrency:
  group: woocommerce-meta-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch WooCommerce products
        env:
          WC_STORE_URL: ${{ vars.WC_STORE_URL }}
          WC_CONSUMER_KEY: ${{ secrets.WC_CONSUMER_KEY }}
          WC_CONSUMER_SECRET: ${{ secrets.WC_CONSUMER_SECRET }}
        run: python sync.py

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update WooCommerce product feed"
            git push
          fi
